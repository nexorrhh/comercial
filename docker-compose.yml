services:
  app:
    build: .
    container_name: cotizaciones-app
    restart: unless-stopped
    environment:
      - PORT=3000
      - SESSION_SECRET=${SESSION_SECRET:-cambiar-este-secreto}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
    volumes:
      - ./data:/app/data
    ports:
      - "3000:3000"

